name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 双平台：Windows 是一等公民（remotetest 的 cmd/job-object、路径
    # 语义都平台相关），Linux 验证跨平台不回归。
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Build (wasm)
        # 浏览器目标是 CI 盲区（issue #184）：开发机的 go build ./...
        # 不碰 js 目标，普通 PR 就能让 wasm 构建静默红——一行堵上。
        if: matrix.os == 'ubuntu-latest'
        run: GOOS=js GOARCH=wasm go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 -timeout 900s ./...
      - name: Eval scenarios
        # 场景评测门禁（spec 规则 54）：zgo eval 驱动真实回放——安全
        # 回归网（trust-gate）与核心回环任一失败即红；退出码即门禁。
        run: go run ./cmd/zgo eval evals
      - name: Test (race)
        # ubuntu 上 CGO 可用，-race 免费逮数据竞态（issue #184：#78/#117/
        # #136 一族都是它能提前拦的类型）。Windows 腿保持无 race（本机
        # 与 runner 同缺 CGO）。
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -count=1 -timeout 900s ./...
