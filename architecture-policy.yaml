version: 1

# 模块依赖治理。所有模块 managed: true；新增模块必须登记。
# 依赖方向（tools 只依赖 agent 的 Tool 接口，接口定义在消费方）：
#   service → agent → (ai, prompt)；tools → agent(接口)；main → service
# 审查规则：
#   - import 出现 policy 之外的路径 → 架构违规
#   - frontend 只允许 import ./mygo（生成客户端）与前端自身模块
modules:
  - id: ai
    roots: [internal/ai]
    managed: true
    requires: []
  - id: prompt
    roots: [internal/prompt]
    managed: true
    requires: []
  - id: tools
    roots: [internal/tools]
    managed: true
    requires: [agent] # 仅 agent.Tool / agent.ToolResult 接口
  - id: agent
    roots: [internal/agent]
    managed: true
    requires: [ai]
  - id: service
    roots: [internal/service]
    managed: true
    requires: [agent, ai, tools, prompt]
  - id: shell
    roots: [main.go]
    managed: true
    requires: [service]
  - id: frontend
    roots: [frontend/src]
    managed: true
    requires: [frontend/src/mygo.ts]
